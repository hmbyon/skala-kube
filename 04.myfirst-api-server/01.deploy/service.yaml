apiVersion: v1
kind: Service
metadata:
  name: sk152-myfirst-api-server
  namespace: class-5
  labels:
    app: sk152-myfirst-api-server
spec:
  type: ClusterIP
  selector:
    app: sk152-myfirst-api-server
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: mgmt
      protocol: TCP
      port: 8081
      targetPort: 8081


